name: Update rankings

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Senior engineer gate — canonical repo only
        run: node scripts/release-gate.mjs --ci-deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      - name: Fetch latest rankings
        run: npm run fetch:rankings
        env:
          FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}

      - name: Build player pool
        run: npm run build:pool

      - name: Build in-season values
        run: npm run build:inseason

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- data public/rankings.json public/injuries.json public/inseason.json public/depth-charts.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit rankings
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw data/rankings.json data/injuries.json data/inseason.json data/depth-charts.json public/rankings.json public/injuries.json public/inseason.json public/depth-charts.json
          git commit -m "chore: refresh fantasy rankings, injuries, and in-season values"
          git push
