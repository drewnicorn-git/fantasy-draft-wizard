name: Deploy Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      - name: Build pool from committed raw data
        run: npm run build:pool
        continue-on-error: true

      - name: Build site
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: Verify build output
        run: |
          grep -q "assets/index" dist/index.html
          test ! -f dist/src/main.ts
          test -f dist/rankings.json
          test -f dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publish built site to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
