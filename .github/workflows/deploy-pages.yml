name: Build and Deploy Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  # Rankings refresh commits use GITHUB_TOKEN and do not fire push workflows.
  workflow_run:
    workflows: [Update rankings]
    types: [completed]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Senior engineer gate — canonical repo and Pages
        run: node scripts/release-gate.mjs --ci-deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      - name: Build site
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Ensure Jekyll is disabled for GitHub Pages
        run: touch dist/.nojekyll

      - name: Verify build output
        run: |
          grep -q "assets/index" dist/index.html
          test ! -f dist/src/main.ts
          test -f dist/rankings.json
          test -f dist/injuries.json
          test -f dist/inseason.json
          test -f dist/depth-charts.json
          test -f dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4